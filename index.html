<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How to Sing Harmony</title>
  <meta name="description" content="Learn to sing hymn harmony. Isolate soprano, alto, tenor, or bass and follow the score as it plays.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127925;</text></svg>">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="icon-btn" title="Back to song list" hidden>&#8592;</button>
      <h1 id="appTitle">How to Sing Harmony <span class="beta">beta</span></h1>
      <a id="homeLink" href="https://calebhugo.com" title="calebhugo.com">calebhugo.com</a>
    </header>

    <section id="listView">
      <div class="list-controls">
        <input id="search" type="search" placeholder="Search hymns&hellip;" autocomplete="off">
      </div>
      <ul id="songList"></ul>
      <footer class="list-footer">
        <p>74 hymns &middot; four-part harmony &middot; pick a part and sing along</p>
        <p><a href="https://sing-harmony.calebhugo.com">classic version</a></p>
      </footer>
    </section>

    <section id="songView" hidden>
      <div id="songHeader">
        <h2 id="songTitle"></h2>
        <div id="songMeta"></div>
      </div>
      <div id="controls">
        <button id="playBtn" class="play-btn" title="Play / pause (space)">
          <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="ic-pause" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div id="voiceChips"></div>
        <div id="menuPanel">
          <div class="menu-title" hidden></div>
          <div class="transport">
            <button id="rewindBtn" class="icon-btn transport-btn" title="Back to start (or loop start)">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <div class="loop-wrap" title="Loop a passage: click a note to place the cursor, then set A and B">
              <button id="loopA" class="icon-btn loop-btn">A</button>
              <button id="loopB" class="icon-btn loop-btn">B</button>
              <button id="loopClear" class="icon-btn loop-btn" hidden>&#10005;</button>
            </div>
            <button id="modeBtn" class="icon-btn transport-btn" title="Toggle page / scrolling score">
              <svg viewBox="0 0 24 24" class="ic-ribbon"><path d="M3 7h18v2H3zm0 4h18v2H3zm0 4h12v2H3z" transform="rotate(90 12 12)"/></svg>
              <svg viewBox="0 0 24 24" class="ic-page" hidden><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>
            </button>
          </div>
          <div class="tempo-wrap">
            <label for="tempo">Tempo</label>
            <input id="tempo" type="range" min="40" max="220" step="1">
            <span id="tempoVal"></span>
            <button id="tempoReset" class="text-btn" title="Reset to the song's tempo">reset</button>
          </div>
          <div id="verseChips" hidden></div>
          <div class="menu-links">
            <button id="backBtn2" class="text-btn">&#8592; all songs</button>
            <a href="https://sing-harmony.calebhugo.com" class="text-btn">classic version</a>
            <a href="https://calebhugo.com" class="text-btn">calebhugo.com</a>
          </div>
        </div>
        <button id="menuBtn" class="icon-btn" title="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
      </div>
      <div id="scoreWrap"><div id="score"></div></div>
      <div id="status" hidden></div>
    </section>
  </div>

  <!-- shown only on small portrait touch screens with a song open -->
  <div id="rotateHint" hidden>
    <div>
      <span class="phone-icon">&#128241;</span>
      Rotate your phone sideways&mdash;<br>the music is much bigger in landscape.
      <br><button type="button">Keep portrait</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
