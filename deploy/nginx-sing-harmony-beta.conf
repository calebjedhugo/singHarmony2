server {
    listen 127.0.0.1:8101;
    server_name sing-harmony-beta.calebhugo.com;

    root /var/www/sing-harmony-beta.calebhugo.com;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    # hashed build assets can cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # song data + shell should revalidate so updates land promptly
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
